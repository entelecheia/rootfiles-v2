extends: base

modules:
  system:
    enabled: true
    journald_max_use: 2G
  users:
    enabled: true
  security:
    enabled: true
    unattended_upgrades: true   # security pocket only, never reboots, NVIDIA/CUDA excluded
    fail2ban: true
    time_sync: true
  cloudflared:
    enabled: true

packages_extra:
  - openssh-server
  - ufw
  - fail2ban

users:
  home_base: /home
  default_shell: /usr/bin/zsh
  default_groups:
    - sudo
  sudo_nopasswd: true

ssh:
  disable_root_login: true
  disable_password_auth: false
